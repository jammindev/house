# Plafonds mémoire — un conteneur emballé ne prend plus la machine.
#
# Le VPS a 3,7 Go et héberge quatre applications plus Traefik et un runner : la
# marge réelle tourne autour du gigaoctet. Sans plafond, un import de relevé un
# peu gros ou une boucle d'OCR faisait tomber les voisins avant de tomber
# lui-même — et c'est l'OOM killer du noyau qui choisissait la victime, jamais
# le coupable.
#
# Les valeurs sont larges à dessein : ~3 à 4 fois l'usage observé
# (web 272 Mo, db 127 Mo, schedulers 75 Mo chacun, nginx 6 Mo). Un plafond serré
# transformerait un pic normal en conteneur tué, ce qui est pire que le problème
# qu'on traite. Ce sont des **plafonds, pas des réservations** : leur somme
# dépasse la RAM disponible, et c'est normal.
#
# ⚠️ À revoir si `docker stats` montre un service durablement au-dessus de la
# moitié de son plafond — un plafond qu'on frôle tous les jours ne protège plus,
# il attend son heure.
services:
  db:
    # pgvector/pgvector:pg16 = official postgres:16 (Debian) + the `vector`
    # extension preinstalled (parcours 21, hybrid semantic retrieval). Same PG
    # major as before, so the postgres-data volume is compatible; a REINDEX after
    # the alpine(musl)->debian(glibc) switch is prudent if text-index collation
    # ever looks off. See docs/parcours/PARCOURS_21_BACKLOG_TECHNIQUE.md.
    image: pgvector/pgvector:pg16
    restart: always
    # Postgres : 127 Mo observés, mais shared_buffers et le cache
    # de pages grossissent avec l'usage. Le tuer serait le pire des cas.
    mem_limit: 1g
    volumes:
      - postgres-data:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: house
      POSTGRES_USER: house_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    networks:
      - internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U house_user -d house"]
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    build: .
    image: house:latest
    restart: always
    # gunicorn 4 workers : 272 Mo observés, avec des pics sur l'OCR,
    # les miniatures et l'import d'un relevé.
    mem_limit: 1g
    depends_on:
      db:
        condition: service_healthy
    env_file: .env
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.production
    volumes:
      - media-files:/app/media
    networks:
      - internal
    # Sonde de vie — c'est elle que le deploy attend (`up -d --wait`) avant de se
    # déclarer terminé. Sans healthcheck, `--wait` se contente de « le conteneur
    # a démarré », ce qui est vrai plusieurs secondes avant que gunicorn accepte
    # une connexion (issue #449).
    #
    # `Host` explicite : ALLOWED_HOSTS ne contient que le domaine public, et la
    # sonde tape 127.0.0.1. `X-Forwarded-Proto` pour ne pas récolter la
    # redirection HTTPS de SecurityMiddleware.
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen(u.Request('http://127.0.0.1:8000/health/', headers={'Host': '${DOMAIN}', 'X-Forwarded-Proto': 'https'}), timeout=5)"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 60s

  # Scheduler des pings proactifs (agent → Telegram). Même image que web, mais la
  # commande gunicorn est remplacée par un tick idempotent en boucle
  # (voir apps/pings/services.py::send_due_pings).
  scheduler:
    image: house:latest
    restart: always
    # 75 Mo observés ; un ping qui rend un bilan mensuel peut monter.
    mem_limit: 512m
    depends_on:
      db:
        condition: service_healthy
      web:
        condition: service_started
    env_file: .env
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.production
    command: ["python", "manage.py", "send_scheduled_pings", "--loop"]
    networks:
      - internal

  # Scheduler des briefings personnalisés (parcours 23). Même image, tick
  # idempotent en boucle (voir apps/briefings/scheduler.py::send_due_briefings).
  scheduler-briefings:
    image: house:latest
    restart: always
    # Idem — même image, même charge de pointe.
    mem_limit: 512m
    depends_on:
      db:
        condition: service_healthy
      web:
        condition: service_started
    env_file: .env
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.production
    command: ["python", "manage.py", "send_due_briefings", "--loop"]
    networks:
      - internal

  nginx:
    image: nginx:alpine
    restart: always
    # 6 Mo observés. Statique et proxy, rien qui grossisse.
    mem_limit: 128m
    depends_on:
      - web
    volumes:
      # Le RÉPERTOIRE, jamais le fichier seul. Un bind mount de fichier unique
      # épingle l'inode : `git reset --hard` n'édite pas le fichier en place, il en
      # écrit un neuf et le renomme par-dessus, donc le conteneur reste sur
      # l'ancien inode — à jamais, et `nginx -s reload` recharge l'ancien contenu.
      # Un correctif de conf semblait livré et ne l'était pas (issue #452).
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      # La page de maintenance (`root` de la location @unavailable). Sans ce
      # montage, `try_files` retombe sur `=503` et sert un 503 *vide* : nginx a la
      # bonne config et rien à afficher avec.
      - ./nginx/html:/usr/share/nginx/html:ro
      - media-files:/app/media:ro
    networks:
      - internal
      - traefik-public
    labels:
      - traefik.enable=true
      - traefik.docker.network=traefik-public
      - traefik.http.services.house.loadbalancer.server.port=80
      # HTTP → redirige vers HTTPS
      - traefik.http.routers.house-http.entrypoints=http
      - traefik.http.routers.house-http.rule=Host(`${DOMAIN}`)
      - traefik.http.routers.house-http.middlewares=https-redirect@docker
      # HTTPS avec Let's Encrypt
      - traefik.http.routers.house-https.entrypoints=https
      - traefik.http.routers.house-https.rule=Host(`${DOMAIN}`)
      - traefik.http.routers.house-https.tls=true
      - traefik.http.routers.house-https.tls.certresolver=le

volumes:
  postgres-data:
  media-files:

networks:
  internal:
  traefik-public:
    external: true
