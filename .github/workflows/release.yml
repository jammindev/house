# Publication de l'image que les autres installent.
#
# Le déploiement de l'auteur ne passe PAS par ici : il construit l'image sur son
# VPS depuis `docker-compose.prod.yml` (job `deploy` de `ci.yml`), et rien dans
# ce fichier ne le touche. Ce workflow n'existe que pour le `docker compose up`
# d'un inconnu, qui doit tirer une image déjà construite — personne ne va
# compiler un bundle React sur un Raspberry Pi pour essayer un produit.
#
# Déclenché par un tag `v*`, jamais par un push sur `main` : une image que
# quelqu'un installe est une **release**, c'est-à-dire une chose datée qu'on peut
# nommer, à laquelle on peut revenir, et dont on peut dire ce qu'elle contient.
# Republier `latest` à chaque commit rendrait « j'ai la dernière version » une
# phrase sans contenu, et un `docker compose pull` un pari.
name: Release

on:
  push:
    tags:
      - "v*"
  # Pour republier une image sans re-tagger (échec de registre, par exemple).
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag git à publier (ex. v0.1.0)"
        required: true
  # Appelé par `release-please.yml` quand la PR de release est fusionnée.
  #
  # ⚠️ C'est un **appel**, pas un déclencheur, et ce n'est pas un détail de
  # style : un tag poussé avec le `GITHUB_TOKEN` ne déclenche aucun workflow
  # (protection anti-boucle de GitHub). Le `push: tags` ci-dessus ne verrait
  # donc jamais le tag de release-please, et l'image ne serait jamais construite
  # — sans une ligne rouge nulle part.
  workflow_call:
    inputs:
      tag:
        description: "Tag git à publier (ex. v0.1.0)"
        required: true
        type: string

permissions:
  contents: read

jobs:
  # Bloquant ici, informatif dans `ci.yml`. Une image qu'on publie sera installée
  # par des gens qui y mettront leurs relevés bancaires : leur distribuer une
  # version dont on n'a pas vérifié qu'elle sait se restaurer, c'est leur
  # promettre une sauvegarde qui n'en est pas une.
  backup:
    name: Backup & restore
    uses: ./.github/workflows/backup-restore.yml

  image:
    name: Publier l'image multi-architecture
    needs: [backup]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Le seul droit d'écriture du job, et il ne porte que sur le registre.
      packages: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      # arm64 sans machine arm64 : le Raspberry Pi et le NAS sont la moitié du
      # public de l'auto-hébergement, et une image amd64 seule leur répond
      # « exec format error » — un message qui n'apprend rien à personne.
      - uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository_owner }}/maisonnee
          # `value=` est ce qui fait marcher la republication.
          #
          # Par défaut ces motifs lisent `github.ref`, qui vaut `refs/heads/main`
          # sur un `workflow_dispatch` : la version ne se déduisait alors d'aucun
          # tag, et republier `v0.1.0` aurait poussé une image nommée `main`.
          # L'entrée existe précisément pour republier sans re-tagger — elle ne
          # servait à rien tant qu'elle ne décidait pas aussi du nom.
          #
          # Vide (déclenchement par tag), `value=` retombe sur la ref git.
          tags: |
            type=semver,pattern={{version}},value=${{ inputs.tag }}
            type=semver,pattern={{major}}.{{minor}},value=${{ inputs.tag }}
            # Même raison : sur une republication, c'est le tag demandé qui dit
            # s'il s'agit d'une préversion, pas la branche depuis laquelle on
            # déclenche. (Limite assumée : republier une version ancienne
            # déplace `latest` — la republication sert à réparer un échec de
            # registre sur la dernière, pas à ressusciter une vieille.)
            type=raw,value=latest,enable=${{ !contains(inputs.tag || github.ref, '-') }}

      - uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Une image qu'on n'a pas démarrée n'est pas une image publiée, c'est un
      # espoir publié. Le test est minuscule et il attrape ce qui casse vraiment
      # : une dépendance native absente de l'architecture, un `collectstatic`
      # raté au build, un module qui ne s'importe pas.
      #
      # ⚠️ **Les deux architectures, et `--platform` explicitement.** Sans lui,
      # `docker run` prend la variante du runner — amd64 — et le manifeste arm64
      # part sans que personne ne l'ait jamais démarré. C'est la moitié du public
      # de l'auto-hébergement (Raspberry Pi, NAS) qui découvrirait le problème à
      # notre place, et la phrase du dessus vaut aussi pour elle. La construction
      # arm64 réussit d'ailleurs sans rien prouver du démarrage : une roue
      # native compilée pour la mauvaise architecture ne se voit qu'à l'import.
      - name: L'image démarre et se connaît (les deux architectures)
        run: |
          set -euo pipefail
          for platform in linux/amd64 linux/arm64; do
            echo "── $platform ───────────────────────────────────────────────"
            # arm64 tourne ici sous QEMU (installé plus haut pour le build) :
            # c'est lent, et c'est le prix d'une vérification qui vaut quelque
            # chose sans avoir de Raspberry Pi dans la CI.
            docker run --rm --platform "$platform" \
              -e DJANGO_SETTINGS_MODULE=config.settings.selfhost \
              -e MAISONNEE_STATE_DIR=/tmp/state \
              -e DATABASE_URL=postgres://u:p@127.0.0.1:5432/none \
              ghcr.io/${{ github.repository_owner }}/maisonnee:${{ steps.meta.outputs.version }} \
              python manage.py check --deploy --fail-level ERROR
          done

  # Ce que les notes de release disent **en plus** de la liste des changements.
  #
  # Depuis release-please, la liste est écrite par lui : il la calcule depuis les
  # commits, en sections, et il crée la release en même temps que le tag. Ce
  # job ne la recompose donc plus — il **ajoute** ce que release-please ne peut
  # pas savoir, et qui est justement le plus utile à qui met à jour : **est-ce
  # que cette version contient une migration ?** Ça ne se lit pas dans un sujet
  # de commit, ça se lit dans le diff des fichiers de migration. C'est cette
  # ligne qui décide s'il faut sauvegarder avant, et si le retour en arrière est
  # encore une simple bascule d'image.
  #
  # Le chemin « aucune release n'existe » reste écrit : un `git tag` à la main
  # court-circuite release-please, et une release sans notes serait pire qu'une
  # release aux notes minimales.
  #
  # **En anglais**, comme le README et `docs/self-hosting/` : le lecteur est
  # l'inconnu qui met à jour son instance (`CLAUDE.md` § Langue). Les notes de
  # `v0.1.0` étaient en français — c'était un écart, pas un choix.
  #
  # Après `image`, jamais avant : annoncer une version dont l'image n'est pas
  # publiée envoie les gens tirer quelque chose qui n'existe pas.
  notes:
    name: Notes de release
    needs: [image]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.tag || github.ref }}
          # L'historique complet : sans lui, `git describe` ne voit aucun tag
          # antérieur et toute release se croirait la première.
          fetch-depth: 0

      - name: Composer le complément « mise à jour »
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail

          # Le tag précédent, s'il y en a un. La toute première release n'a rien
          # à comparer : elle ne peut donc pas dire si « cette version » ajoute
          # une migration, puisqu'elle les contient toutes.
          previous="$(git describe --tags --abbrev=0 "$TAG^" 2>/dev/null || true)"

          {
            echo
            echo "---"
            echo
            # Le signal qui décide d'une sauvegarde préalable. C'est la seule
            # information de ces notes qu'aucune lecture des sujets de commit ne
            # donne, et la plus coûteuse à retrouver soi-même.
            if [ -z "$previous" ]; then
              : # rien à comparer
            elif git diff --name-only "$previous..$TAG" -- '*/migrations/*.py' | grep -q .; then
              echo "> ⚠️ **This release contains a database migration.**"
              echo "> Back up before upgrading — rolling back is no longer a matter of"
              echo "> switching the image tag:"
              echo "> [backup and restore](https://github.com/${GITHUB_REPOSITORY}/blob/${TAG}/docs/self-hosting/backup-restore.md)."
            else
              echo "> No database migration in this release."
            fi

            echo
            echo "Upgrade:"
            echo
            echo '```bash'
            echo "docker compose pull && docker compose up -d"
            echo '```'
            echo
            echo "Install, back up and upgrade:"
            echo "[docs/self-hosting](https://github.com/${GITHUB_REPOSITORY}/blob/${TAG}/docs/self-hosting/README.md)."
          } > /tmp/supplement.md

          cat /tmp/supplement.md

      - name: Compléter la release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail

          if gh release view "$TAG" >/dev/null 2>&1; then
            # Le cas normal : release-please a créé la release avec sa liste de
            # changements, on ajoute le complément à la suite.
            #
            # ⚠️ **Idempotent.** Republier une image sans re-tagger (le
            # `workflow_dispatch` existe pour ça) rejouerait ce job : sans ce
            # garde, la release accumulerait un bloc « mise à jour » par
            # republication.
            body="$(gh release view "$TAG" --json body --jq .body)"
            if printf '%s' "$body" | grep -q 'docker compose pull'; then
              echo "Complément déjà présent — rien à ajouter."
              exit 0
            fi
            printf '%s\n' "$body" > /tmp/notes.md
            cat /tmp/supplement.md >> /tmp/notes.md
            gh release edit "$TAG" --notes-file /tmp/notes.md
          else
            # Aucune release : un `git tag` posé à la main, qui court-circuite
            # release-please. On retombe sur la liste dérivée des commits — des
            # notes minimales valent mieux qu'une release muette.
            previous="$(git describe --tags --abbrev=0 "$TAG^" 2>/dev/null || true)"
            {
              if [ -z "$previous" ]; then
                echo "First published release of Maisonnée."
              else
                echo "Changes since \`$previous\`."
                echo
                # Seuls `feat`, `fix` et `perf` : le reste est interne, et une
                # liste où les refactors côtoient les corrections se lit comme
                # du bruit — même contrat que le changelog in-app.
                if git log --no-merges --pretty=%s "$previous..$TAG" \
                     | grep -E '^(feat|fix|perf)(\([^)]*\))?:' > /tmp/user_facing.txt; then
                  sed 's/^/- /' /tmp/user_facing.txt
                else
                  echo "_No user-facing changes._"
                fi
              fi
            } > /tmp/notes.md
            cat /tmp/supplement.md >> /tmp/notes.md
            gh release create "$TAG" \
              --title "$TAG" \
              --notes-file /tmp/notes.md \
              $([ "${TAG#*-}" != "$TAG" ] && echo --prerelease || true)
          fi
