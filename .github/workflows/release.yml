# Publication de l'image que les autres installent.
#
# Le déploiement de l'auteur ne passe PAS par ici : il construit l'image sur son
# VPS depuis `docker-compose.prod.yml` (job `deploy` de `ci.yml`), et rien dans
# ce fichier ne le touche. Ce workflow n'existe que pour le `docker compose up`
# d'un inconnu, qui doit tirer une image déjà construite — personne ne va
# compiler un bundle React sur un Raspberry Pi pour essayer un produit.
#
# Déclenché par un tag `v*`, jamais par un push sur `main` : une image que
# quelqu'un installe est une **release**, c'est-à-dire une chose datée qu'on peut
# nommer, à laquelle on peut revenir, et dont on peut dire ce qu'elle contient.
# Republier `latest` à chaque commit rendrait « j'ai la dernière version » une
# phrase sans contenu, et un `docker compose pull` un pari.
name: Release

on:
  push:
    tags:
      - "v*"
  # Pour republier une image sans re-tagger (échec de registre, par exemple).
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag git à publier (ex. v0.1.0)"
        required: true

permissions:
  contents: read

jobs:
  # Bloquant ici, informatif dans `ci.yml`. Une image qu'on publie sera installée
  # par des gens qui y mettront leurs relevés bancaires : leur distribuer une
  # version dont on n'a pas vérifié qu'elle sait se restaurer, c'est leur
  # promettre une sauvegarde qui n'en est pas une.
  backup:
    name: Backup & restore
    uses: ./.github/workflows/backup-restore.yml

  image:
    name: Publier l'image multi-architecture
    needs: [backup]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Le seul droit d'écriture du job, et il ne porte que sur le registre.
      packages: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      # arm64 sans machine arm64 : le Raspberry Pi et le NAS sont la moitié du
      # public de l'auto-hébergement, et une image amd64 seule leur répond
      # « exec format error » — un message qui n'apprend rien à personne.
      - uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository_owner }}/maisonnee
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ !contains(github.ref, '-') }}

      - uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Une image qu'on n'a pas démarrée n'est pas une image publiée, c'est un
      # espoir publié. Le test est minuscule et il attrape ce qui casse vraiment
      # : une dépendance native absente de l'architecture, un `collectstatic`
      # raté au build, un module qui ne s'importe pas.
      - name: L'image démarre et se connaît
        run: |
          docker run --rm \
            -e DJANGO_SETTINGS_MODULE=config.settings.selfhost \
            -e MAISONNEE_STATE_DIR=/tmp/state \
            -e DATABASE_URL=postgres://u:p@127.0.0.1:5432/none \
            ghcr.io/${{ github.repository_owner }}/maisonnee:${{ steps.meta.outputs.version }} \
            python manage.py check --deploy --fail-level ERROR

  # Les notes de release, écrites depuis l'historique.
  #
  # `docs/self-hosting/releases.md` promet deux choses à qui met à jour : ce qui
  # a changé, et **si la version contient une migration**. La seconde est la plus
  # utile et la moins évidente à retrouver soi-même — c'est elle qui décide s'il
  # faut sauvegarder avant, et si un retour en arrière est encore possible.
  #
  # Après `image`, jamais avant : annoncer une version dont l'image n'est pas
  # publiée envoie les gens tirer quelque chose qui n'existe pas.
  notes:
    name: Notes de release
    needs: [image]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.tag || github.ref }}
          # L'historique complet : sans lui, `git describe` ne voit aucun tag
          # antérieur et toute release se croirait la première.
          fetch-depth: 0

      - name: Composer les notes
        id: compose
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail

          # Le tag précédent, s'il y en a un. La toute première release n'en a
          # pas : elle ne peut donc pas lister « ce qui a changé depuis », et
          # prétendre le contraire en déroulant tout l'historique ne renseigne
          # personne.
          previous="$(git describe --tags --abbrev=0 "$TAG^" 2>/dev/null || true)"

          {
            if [ -z "$previous" ]; then
              echo "Première release publiée de Maisonnée."
              echo
              echo "Installation, sauvegarde et mise à jour :"
              echo "[docs/self-hosting](https://github.com/${GITHUB_REPOSITORY}/blob/${TAG}/docs/self-hosting/README.md)."
              range="$TAG"
            else
              range="$previous..$TAG"
              echo "Changements depuis \`$previous\`."
              echo
              # Seuls `feat`, `fix` et `perf` : le reste est interne, et une
              # liste où les refactors côtoient les corrections se lit comme du
              # bruit — même contrat que le changelog in-app.
              if git log --no-merges --pretty=%s "$range" \
                   | grep -E '^(feat|fix|perf)(\([^)]*\))?:' > /tmp/user_facing.txt; then
                sed 's/^/- /' /tmp/user_facing.txt
              else
                echo "_Aucun changement visible par l'utilisateur._"
              fi
            fi

            echo
            # Le signal qui décide d'une sauvegarde préalable.
            if [ -n "$previous" ] && git diff --name-only "$range" -- '*/migrations/*.py' | grep -q .; then
              echo "> ⚠️ **Cette version contient une migration de base de données.**"
              echo "> Sauvegarde avant de mettre à jour, et le retour en arrière n'est"
              echo "> plus une simple bascule d'image :"
              echo "> [backup-restore](https://github.com/${GITHUB_REPOSITORY}/blob/${TAG}/docs/self-hosting/backup-restore.md)."
            elif [ -n "$previous" ]; then
              echo "> Aucune migration de base de données dans cette version."
            fi

            echo
            echo '```bash'
            echo "docker compose pull && docker compose up -d"
            echo '```'
          } > /tmp/notes.md

          cat /tmp/notes.md

      - name: Publier la release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          # Idempotent : republier une image sans re-tagger (le `workflow_dispatch`
          # existe pour ça) ne doit pas échouer sur une release déjà là.
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --notes-file /tmp/notes.md
          else
            gh release create "$TAG" \
              --title "$TAG" \
              --notes-file /tmp/notes.md \
              $([ "${TAG#*-}" != "$TAG" ] && echo --prerelease || true)
          fi
