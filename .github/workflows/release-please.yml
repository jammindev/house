# Préparer la prochaine version, et la publier quand on décide de la publier.
#
# ── Pourquoi cet outil, et pourquoi pas l'automatisation totale ───────────────
#
# `release.yml` porte une décision écrite : une image que quelqu'un installe est
# une **release**, donc elle se déclenche sur un tag, jamais sur un push. C'est
# juste, et publier automatiquement à chaque merge la casserait — « j'ai la
# dernière version » redeviendrait une phrase sans contenu.
#
# Mais le défaut réel n'était pas l'absence d'automatisation : `v0.1.0` est
# restée seule pendant neuf jours pendant que toute la façade était livrée, et un
# inconnu qui installait recevait une app appelée « House », sans logo. Personne
# n'avait décidé de ne pas publier — personne n'y avait pensé.
#
# D'où release-please, qui n'automatise pas la décision mais la **rend visible** :
# il tient en permanence une PR « release X.Y.Z » qui s'enrichit à chaque merge.
# Le numéro et les notes sont calculés depuis les commits — ce qui ne marche que
# parce que `type(scope): description` est déjà un contrat dans ce dépôt, imposé
# pour le changelog in-app. Publier reste un geste : fusionner cette PR.
#
# ── ⚠️ Le piège qui aurait tout cassé en silence ──────────────────────────────
#
# Un tag poussé avec le `GITHUB_TOKEN` par défaut **ne déclenche aucun workflow**
# (protection anti-boucle de GitHub). Le câblage évident — release-please pousse
# le tag, `release.yml` écoute `push: tags` — aurait donc créé le tag et la
# release, et **jamais construit l'image**. Aucune erreur, aucun job rouge : juste
# une release qui annonce une version que le registre n'a pas.
#
# On n'y remédie donc pas par un déclencheur mais par un **appel** : `release.yml`
# est `workflow_call`, et on l'invoque ici. Son entrée `tag` existait déjà, écrite
# pour la republication.
# ── ⚠️ Le second piège : ce dépôt n'autorise pas n'importe quelle action ─────
#
# `allowed_actions: selected` (durcissement du lot 0) : seules les actions de
# GitHub, plus une liste nommée, ont le droit de tourner. Une action absente de
# cette liste fait échouer le workflow **au démarrage** — zéro job, zéro log, et
# pour tout message « This run likely failed because of a workflow file issue »,
# alors que le fichier est parfaitement valide.
#
# `googleapis/release-please-action@*` a donc dû y être ajoutée. Si ce workflow
# se remet un jour à échouer sans rien dire après un changement d'action,
# regarder là **avant** de relire le YAML :
#
#   gh api /repos/jammindev/house/actions/permissions/selected-actions
#
# Et la version est **v4.4.1 (node20)**, pas la v5.0.0 : celle-ci tourne en
# `node24`, un runtime dont on n'a pas vérifié qu'il s'exécute sur le runner —
# la référence *résout*, ce qui ne prouve rien de l'exécution. `sha_pinning_required`
# est actif de toute façon : l'épinglage par empreinte n'est pas une politesse.
name: Release Please

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: release-please
  cancel-in-progress: false

jobs:
  prepare:
    name: Tenir la PR de release à jour
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.rp.outputs.release_created }}
      tag_name: ${{ steps.rp.outputs.tag_name }}
    steps:
      - id: rp
        uses: googleapis/release-please-action@5c625bfb5d1ff62eadeeb3772007f7f66fdcf071 # v4.4.1
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  # Ne tourne que sur le push qui **fusionne** la PR de release — c'est le seul
  # moment où `release_created` est vrai.
  publish:
    name: Publier l'image de cette version
    needs: [prepare]
    if: needs.prepare.outputs.release_created == 'true'
    permissions:
      contents: write
      packages: write
    uses: ./.github/workflows/release.yml
    with:
      tag: ${{ needs.prepare.outputs.tag_name }}
