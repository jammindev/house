name: Secrets scan

# Le dépôt est public : un secret commité est un secret publié, et le révoquer
# après coup ne le retire ni des clones, ni des caches, ni des miroirs. Ce
# workflow est donc une barrière d'entrée, pas un audit — l'audit complet de
# l'historique a été fait une fois, voir
# docs/journal/2026-07-31_parcours-28_lot0_audit-historique.md
#
# ⚠️ On utilise le **binaire** gitleaks, pas `gitleaks/gitleaks-action`.
# L'action refuse de tourner sur un compte *organisation* sans licence payante
# (« [jammindev] is an organization. License key is required. ») — et jammindev
# en est une. Le binaire, lui, est libre et sans condition. Bénéfice secondaire :
# une dépendance tierce de moins dans la CI, donc une entrée de moins dans
# l'allowlist `allowed_actions` du dépôt.
#
# Tourne sur `ubuntu-latest`, jamais sur le runner self-hosted, et n'a besoin
# d'aucun secret : gitleaks lit le code, rien d'autre.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  # Version épinglée : une version flottante ferait varier les règles de
  # détection sans qu'aucun commit ne l'explique — un scan qui change d'avis
  # tout seul n'est pas une barrière, c'est du bruit.
  GITLEAKS_VERSION: 8.30.1

jobs:
  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # Historique complet : sur une PR, gitleaks doit voir les commits
          # ajoutés, pas seulement l'arbre final. Un secret ajouté puis retiré
          # dans la même branche reste dans l'historique de la PR — et donc dans
          # `main` après un merge sans squash.
          fetch-depth: 0

      - name: Install gitleaks
        run: |
          curl -sSfL \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | tar -xz -C /usr/local/bin gitleaks
          gitleaks version

      # `--config` est explicite : sans lui, l'allowlist par SHA de .gitleaks.toml
      # ne serait pas chargée et les quatre faux positifs historiques feraient
      # échouer chaque exécution. Voir le journal du lot 0.
      - name: Scan
        run: |
          gitleaks detect \
            --source=. \
            --config=.gitleaks.toml \
            --redact \
            --no-banner \
            --verbose
