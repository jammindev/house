name: Secrets scan

# Le dépôt est public : un secret commité est un secret publié, et le révoquer
# après coup ne le retire pas des clones ni des caches. Ce workflow est donc une
# barrière d'entrée, pas un audit — l'audit complet de l'historique a été fait une
# fois (voir docs/journal/, parcours 28 lot 0).
#
# Il tourne sur `ubuntu-latest` (jamais sur le runner self-hosted) et n'a besoin
# d'aucun secret : gitleaks lit le code, rien d'autre.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # Historique complet : sur une PR, gitleaks doit voir les commits
          # ajoutés, pas seulement l'arbre final. Un secret ajouté puis retiré
          # dans la même branche reste dans l'historique de la PR — et donc dans
          # `main` après un merge sans squash.
          fetch-depth: 0

      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
